name: Compila APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Chiave di firma (dai Secrets del repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Manca il secret KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/firma.keystore

      - name: Compila
        env:
          KEYSTORE_FILE: firma.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepara APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk GaranzieScontrini.apk
          rm -f app/firma.keystore

      - name: Allega ai risultati della build
        uses: actions/upload-artifact@v4
        with:
          name: GaranzieScontrini-apk
          path: GaranzieScontrini.apk

      - name: Pubblica come ultima versione
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-versione
          name: Ultima versione
          body: |
            Garanzie & Scontrini per Android.
            Per installarla scarica GaranzieScontrini.apk dal telefono e aprilo.
          make_latest: true
          files: GaranzieScontrini.apk
