name: Compila APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compila
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepara APK
        run: cp app/build/outputs/apk/release/app-release.apk GaranzieScontrini.apk

      - name: Allega ai risultati della build
        uses: actions/upload-artifact@v4
        with:
          name: GaranzieScontrini-apk
          path: GaranzieScontrini.apk

      - name: Pubblica come ultima versione
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-versione
          name: Ultima versione
          body: APK compilato automaticamente. Scarica GaranzieScontrini.apk dal telefono e installalo.
          make_latest: true
          files: GaranzieScontrini.apk
