<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TR/software — Garanzie &amp; Scontrini</title>
<style>
:root{
  --bg:#eceef0; --card:#fff; --text:#1d2530; --muted:#6b7480; --line:#dde2e8;
  --accent:#0EA5E9; --accent-soft:rgba(56,189,248,.16);
  --ok:#16a34a; --ok-soft:#e7f6ec; --warn:#d97706; --warn-soft:#fdf1e2; --bad:#dc2626; --bad-soft:#fde8e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#1a1a1a;color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;min-height:62px}
header .back{flex:none;border:0;background:#333;color:#fff;font:inherit;font-size:16px;border-radius:10px;padding:8px 14px;white-space:nowrap}
header .back:active{background:#444}
header h1{flex:1;margin:0;font-size:20px;font-weight:500;letter-spacing:.2px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
header .hdate{color:#9a9a9a;font-size:14px;white-space:nowrap}
header.sub .hdate{font-size:12.5px;white-space:normal;text-align:right;max-width:76px;line-height:1.25}
header.sub h1{font-size:18.5px}
.statusbar{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12.5px;color:#555;background:#f6f7f8;border-bottom:1px solid var(--line);flex-wrap:wrap}
.statusbar .st{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 11px;min-width:0;max-width:100%}
.statusbar .st span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* home a schede */
.hero{text-align:center;padding:14px 6px 22px;color:#666}
.hero .day{font-size:18px;color:#555;margin-bottom:8px}
.hero .sum{font-size:14.5px;line-height:1.75}
.hero .sum b{color:#1d2530;font-weight:500}
.hero .sum a{color:inherit;text-decoration:none}
.tile{display:flex;align-items:center;gap:18px;background:#fff;border:1.5px solid #dcdcdc;border-radius:20px;padding:22px 20px;margin-bottom:14px;cursor:pointer}
.tile:active{background:#f5f6f7}
.tile .ic{width:58px;height:58px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
.tile .tx{flex:1;min-width:0}
.tile .t1{font-size:19px;color:#1d2530;margin-bottom:2px}
.tile .t2{font-size:14px;color:#777}
.tile .chev{color:#b5b5b5;font-size:22px}
.tile .cnt{background:var(--warn);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px;margin-left:6px;vertical-align:3px}
.scelta{display:flex;align-items:center;gap:14px;border:1.5px solid #dcdcdc;border-radius:16px;padding:14px;margin-top:10px;cursor:pointer;background:#fff}
.scelta .ic{width:48px;height:48px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px}
.scelta .tx{flex:1;min-width:0} .scelta .t1{font-size:16.5px;color:#1d2530} .scelta .t2{font-size:13px;color:#777}
.scelta .rd{width:22px;height:22px;border-radius:50%;border:2px solid #c3c7cc;flex:none}
.scelta.off{opacity:.55}
.presto{font-size:11px;font-weight:600;background:#eef0f3;color:#6b7480;border-radius:99px;padding:2px 8px;vertical-align:2px;margin-left:4px}
.scelta.on{border-color:#1a1a1a;box-shadow:inset 0 0 0 1px #1a1a1a}
.scelta.on .rd{border:7px solid #1a1a1a}
.koline{background:var(--bad-soft);color:#991b1b;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px;white-space:pre-line;word-break:break-word}
.okline{background:var(--ok-soft);color:#166534;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.card.fcard{padding:0;overflow:hidden}
.fhead{padding:16px 18px;font-size:17px;font-weight:500;border-bottom:1px solid #ececec}
.fbody{padding:6px 18px 18px}
.fbody label{font-size:14px;color:#666;margin:12px 0 6px}
.fbody select,.fbody input{border:1.5px solid #d6d6d0;border-radius:12px;padding:12px 14px;font-size:16px;background:#fff}
.fbtns{display:flex;gap:10px;margin-top:14px}
.fbtns button{font:inherit;font-size:16px;border-radius:12px;padding:10px 20px}
.bk{background:#1a1a1a;color:#fff;border:1.5px solid #1a1a1a}
.bw{background:#fff;color:#1d2530;border:1.5px solid #d6d6d0}
.periodo{margin:0 6px 12px;color:#555;font-size:14.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid #dcdcdc;background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;color:#444}
.chip.on{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1.5px solid #dcdcdc;border-radius:16px;padding:12px 10px;text-align:center}
.kpi.wide{grid-column:1 / -1}
.kpi .kv{font-size:20px;font-weight:600;color:#1d2530}
.kpi.wide .kv{font-size:28px}
.kpi .kl{font-size:12.5px;color:#777}
.hb{padding:7px 0;cursor:pointer}
.hbl{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#333}
.hbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbl b{font-weight:600;white-space:nowrap}
.hbt{height:10px;background:#f0f1f3;border-radius:4px;margin-top:4px}
.hbf{height:100%;background:#0EA5E9;border-radius:4px}
.hbf.alt{background:#9aa3ad}
.hb.sel .hbf{background:#0369a1}
.hbn{font-size:12px;color:#888;margin-top:2px}
.vb{display:flex;align-items:flex-end;gap:4px;height:170px;margin-top:8px;border-bottom:1px solid #e3e5e8}
.vbc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;min-width:0}
.vbt{flex:1;display:flex;align-items:flex-end}
.vbf{width:100%;background:#0EA5E9;border-radius:4px 4px 0 0}
.vbc.sel .vbf{background:#0369a1}
.vb.fitto{gap:1px} .vb.fitto .vbk{font-size:10px;overflow:visible}
.vbk{font-size:11px;color:#777;text-align:center;padding-top:4px;white-space:nowrap;overflow:hidden}
.tip{font-size:13.5px;color:#555;background:#f6f7f8;border-radius:8px;padding:8px 10px}
.stat{cursor:pointer}
.stat:active{background:#f5f6f7}
.stat.sel{border-color:#1a1a1a;box-shadow:inset 0 0 0 1px #1a1a1a}
.footer{text-align:center;margin:26px 0 6px}
.footer .logo{width:150px;height:130px;margin:0 auto -6px}
.footer .logo svg{width:100%;height:100%;display:block}
.footer .brand{font-size:17px;font-weight:600;color:#333;letter-spacing:.3px}
.footer .sub{font-size:12.5px;color:#888;margin-bottom:10px}
.ver{cursor:pointer;position:fixed;right:14px;bottom:14px;z-index:7;background:#e6e8eb;color:#8a9097;font:13.5px ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;letter-spacing:.3px;padding:7px 16px;border-radius:99px;box-shadow:0 0 0 3px #eceef0}
.dot{width:10px;height:10px;border-radius:50%;background:#c3c9d1;flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)} .dot.old{background:var(--warn)}
.dot.run{background:#0EA5E9;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
main{padding:16px 14px 40px;max-width:760px;margin:0 auto}
nav{display:none!important;position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span{font-size:20px;line-height:1}
nav button.active{color:var(--accent);font-weight:600}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--warn);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;min-width:16px}
.card{background:var(--card);border:1.5px solid #dcdcdc;border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:130px}
label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:10px 14px;font:inherit;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:#f3c4c4}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;border:1px solid var(--line);overflow:hidden;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);text-align:center;padding:2px;word-break:break-all}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.thumb button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;z-index:2}
.items{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.items td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.items td.num{text-align:right}
.items input{padding:6px;font-size:13.5px}
.artline{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.artline span{color:var(--muted);font-size:13px}
.artline .q{width:58px}
.artline .p{width:92px}
.artline .btn.small{padding:6px 10px}
.entry{display:flex;gap:12px;align-items:center;padding:14px;background:var(--card);border:1.5px solid #dcdcdc;border-radius:16px;margin-bottom:8px}
.entry .ico{width:46px;height:46px;flex:none;border-radius:9px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:21px}
.entry .txt{flex:1;min-width:0}
.entry .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .t2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:#eef0f3;color:var(--muted)}
.pill.up{background:var(--accent-soft);color:#0369a1}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1.5px solid #dcdcdc;border-radius:16px;padding:10px;text-align:center;font-size:12.5px}
.stat b{display:block;font-size:22px}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.status{margin-top:10px;font-size:13.5px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#1d2530;color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:20}
#toast.show{opacity:1} #toast.err{background:var(--bad)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:14px;right:14px}
.hidden{display:none!important}
.banner{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-soft);border:1px solid #f4d6ab;color:#7a4a05}
.banner.info{background:var(--accent-soft);border:1px solid #bfe6f8;color:#075985}
.banner > div{flex:1}
details{margin-top:8px} summary{color:var(--muted);font-size:13px}
pre.ocr{white-space:pre-wrap;font-size:12px;background:#f6f7f9;border-radius:8px;padding:8px;max-height:260px;overflow:auto}
.side-body{animation:mbob 2.2s ease-in-out infinite}
.side-arm{transform-origin:79px 76px;animation:armSwing 2.2s ease-in-out infinite}
.side-folder{animation:fglow 2.2s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes armSwing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes fglow{0%,30%,100%{filter:none}50%,70%{filter:drop-shadow(0 0 6px #38BDF8)}}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px 28px}
.modal h2{margin:0 0 4px;font-size:19px;font-weight:500}
.modal .rel{border-top:1px solid var(--line);padding:12px 0}
.modal .rel b{font-size:15px} .modal .rel span{color:#888;font-size:12.5px;margin-left:6px}
.modal .rel ul{margin:6px 0 0;padding-left:20px;font-size:14px;color:#444}
</style>

<header>
  <button class="back hidden" id="hBack">← Home</button>

  <div class="st" id="stConn"><i class="dot" id="nasDot"></i><span id="nasLine">Destinazione non configurata</span></div>

</div>

  <button data-v="acquisisci"><span>📷</span>Acquisisci</button>

<script>
"use strict";
/* =========================================================
   Ponte Android
   ========================================================= */
const A = window.AndroidBridge || null;
const pending = {};
window.__bridgeCb = (id, ok, payload) => {
  const p = pending[id]; if(!p) return; delete pending[id];
  ok ? p.res(payload) : p.rej(new Error(payload));
};
function call(fn, ...args){
  if(!A) return Promise.reject(new Error("Funzione disponibile solo nell'app Android."));
  return new Promise((res, rej) => {
    const id = "c" + Date.now() + Math.random().toString(36).slice(2);
    pending[id] = {res, rej};
    try{ A[fn](id, ...args); }catch(e){ delete pending[id]; rej(e); }
  });
}

/* =========================================================
   Indice locale (copia dell'archivio sul NAS, per cercare anche offline)
   ========================================================= */
let dbp = null;
function db(){
  if(!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open("garanzie_scontrini", 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if(d.objectStoreNames.contains("acquisti")) d.deleteObjectStore("acquisti");
      d.createObjectStore("acquisti", {keyPath:"id"});
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function st(mode){ return (await db()).transaction("acquisti", mode).objectStore("acquisti"); }
async function allAcquisti(){ return rq((await st("readonly")).getAll()); }
async function getAcquisto(id){ return rq((await st("readonly")).get(id)); }
async function putAcquisto(a){ return rq((await st("readwrite")).put(a)); }
async function delAcquisto(id){ return rq((await st("readwrite")).delete(id)); }

/* =========================================================
   Impostazioni (NAS: password tenuta solo dalla parte Android)
   ========================================================= */
const DEFAULTS = {mesiDefault:24, giorniAvviso:30, apiKey:"", model:"claude-sonnet-5-5", ultimoAggiornamento:""};
function settings(){ try{ return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("gs_settings") || "{}")); }catch(e){ return Object.assign({}, DEFAULTS); } }
function saveSettings(p){ localStorage.setItem("gs_settings", JSON.stringify(Object.assign(settings(), p))); }
function nasCfg(){
  if(!A) return {host:"", share:"", folder:"", user:"", domain:"", hasPassword:false};
  try{ return JSON.parse(A.getNasConfig()); }catch(e){ return {}; }
}
const nasReady = () => { const c = nasCfg(); return !!(c.host && c.share); };
function archivioPronto(){
  const m = archivioScelto();
  if(!A) return false;
  if(m === "nas") return nasReady();
  if(m === "locale") return !!(A.getLocalFolder && A.getLocalFolder());
  if(m === "gdrive") return !!(A.getDriveAccount && A.getDriveAccount());
  return false;
}
const NOMI_ARCHIVIO = {nas:"NAS", locale:"cartella del telefono", gdrive:"Google Drive"};
function nomeArchivio(){ return NOMI_ARCHIVIO[archivioScelto()] || "archivio"; }
function etichettaArchivio(){
  const m = archivioScelto();
  if(m === "gdrive") return "☁️ Google Drive · " + ((A && A.getDriveAccount && A.getDriveAccount()) || settings().driveAccount || "non collegato");
  if(m === "locale") return "📱 " + ((A && A.getLocalFolder && A.getLocalFolder()) || settings().localFolder || "nessuna cartella scelta");
  return nasLabel();
}
function nasLabel(){ const c = nasCfg(); return c.host ? `\\\\${c.host}\\${c.share}${c.folder ? "\\" + c.folder : ""}` : "NAS non configurato"; }

/* =========================================================
   Utilità
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg, err){ const t = $("#toast"); t.textContent = msg; t.className = "show" + (err ? " err" : ""); clearTimeout(t._h); t._h = setTimeout(() => t.className = "", 3500); }
const euro = n => (n === "" || n === null || n === undefined || isNaN(n)) ? "" : Number(n).toLocaleString("it-IT", {style:"currency", currency:"EUR"});
function fmtDate(iso){ if(!iso) return "—"; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; }
function todayISO(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function addMonths(iso, months){
  const [y, m, d] = iso.split("-").map(Number);
  const t = new Date(Date.UTC(y, m - 1 + Number(months), 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(d, last)); return t.toISOString().slice(0, 10);
}
const daysLeft = iso => Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(todayISO() + "T00:00:00Z")) / 86400000);
function scadenzaInfo(a){
  if(!a.dataAcquisto || !Number(a.garanziaMesi)) return {cls:"none", label: a.dataAcquisto ? "Senza garanzia" : "Data mancante", days:null, date:""};
  const date = addMonths(a.dataAcquisto, a.garanziaMesi), days = daysLeft(date);
  if(days < 0) return {cls:"bad", label:"Scaduta il " + fmtDate(date), days, date};
  if(days <= settings().giorniAvviso) return {cls:"warn", label: days === 0 ? "Scade oggi" : `Scade tra ${days} gg (${fmtDate(date)})`, days, date};
  return {cls:"ok", label:"In garanzia fino al " + fmtDate(date), days, date};
}
function safeName(s){ return String(s || "").replace(/[\\/:*?"<>|#%]+/g, " ").replace(/\s+/g, " ").trim().replace(/[. ]+$/, "").slice(0, 60); }
function folderFor(a){ return `${safeName(a.negozio) || "Negozio sconosciuto"}/${safeName(a.nome) || "Acquisto"} ${(a.dataAcquisto || todayISO()).replace(/-/g, "_")}`; }

function readAsDataURL(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); }); }

async function prepareFile(file){

  if(file.type === "application/pdf" || /\.pdf$/i.test(file.name)) return {name:file.name || "documento.pdf", mime:"application/pdf", data:url.split(",")[1]};
  const img = await loadImage(url), max = 2400, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);

const num = s => { const v = parseFloat(String(s).replace(/\s/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")); return isNaN(v) ? null : v; };
const PRICE = "(-?\\d{1,5}(?:\\.\\d{3})*\\s?[,.]\\s?\\d{2})";
function fixYear(y){
  const now = new Date().getFullYear();
  if(y < 100) y += 2000;
  if(y > now){ // errore di lettura (es. 2076 invece di 2026): prende l'anno plausibile più vicino
    const s = String(y), alts = new Set();
    const sw = {"0":["9","8"],"9":["6","0"],"5":["6"],"6":["5","9","8"],"8":["6","0","3"],"7":["2","1"],"3":["8"],"1":["7"],"2":["7"]};
    for(let i = 0; i < 4; i++) for(const c of (sw[s[i]] || [])) alts.add(+(s.slice(0, i) + c + s.slice(i + 1)));
    const ok = [...alts].filter(v => v <= now && v >= 1990).sort((a, b) => b - a);
    y = ok.length ? ok[0] : now;
  }
  return y;
}
function parseReceipt(text){
  const lines = text.split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const all = lines.join("\n"), up = all.toUpperCase();
  const out = {negozio:"", dataAcquisto:"", prezzo:"", numeroScontrino:"", tipoPagamento:"", negozioIndirizzo:"", negozioCitta:"", negozioTelefono:"", articoli:[]};
  // negozio
  const noto = NEGOZI_NOTI.find(n => up.includes(n.toUpperCase()));
  if(noto) out.negozio = noto;
  else{
    const cand = lines.slice(0, 6).find(l => /[A-Za-z]{3,}/.test(l) && !/(documento|commerciale|via |viale|piazza|p\.?\s?iva|partita|tel|www|http|@|srl|s\.r\.l|spa|s\.p\.a)/i.test(l));
    if(cand) out.negozio = cand.replace(/[^\p{L}\d &'.-]/gu, "").trim().slice(0, 40);
  }
  // data
  let best = null;
  for(const m of all.matchAll(/\b(\d{1,2})\s?[\/.\-]\s?(\d{1,2})\s?[\/.\-]\s?(\d{2,4})\b/g)){
    const d = +m[1], mo = +m[2], y = fixYear(+m[3]);
    if(d >= 1 && d <= 31 && mo >= 1 && mo <= 12){ best = `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`; if(/\d{2}:\d{2}/.test(all.slice(m.index, m.index + 30))) break; }
  }
  if(best) out.dataAcquisto = best;
  // totale
  const tot = all.match(new RegExp("(?:TOTALE\\s*COMPLESSIVO|TOTALE\\s*EURO|TOTALE\\s*EUR|IMPORTO\\s*PAGATO|TOTALE|TOT\\.?)\\s*(?:€|EUR|EURO)?\\s*:?\\s*" + PRICE, "i"));
  if(tot) out.prezzo = num(tot[1]);
  // numero documento
  const nd = all.match(/(?:DOCUMENTO\s*N\.?|DOC\.?\s*N\.?|SCONTRINO\s*N\.?|FATTURA\s*N\.?|N\.\s*DOC\.?)\s*[:°]?\s*([\w\-\/]{3,})/i);
  if(nd) out.numeroScontrino = nd[1];
  // pagamento
  if(/BANCOMAT|PAGOBANCOMAT/i.test(all)) out.tipoPagamento = "Bancomat";
  else if(/CARTA|VISA|MASTERCARD|AMEX|MAESTRO|ELETTRONICO|POS/i.test(all)) out.tipoPagamento = "Carta";
  else if(/CONTANT/i.test(all)) out.tipoPagamento = "Contanti";
  // indirizzo, città, telefono
  const ind = lines.find(l => /^(via|viale|piazza|piazzale|corso|largo|strada|s\.?s\.?|sp|loc\.?)\b/i.test(l)); if(ind) out.negozioIndirizzo = ind.slice(0, 60);
  const cap = all.match(/\b\d{5}\s*[-–]?\s*([A-Z][A-Za-zÀ-ù' ]{2,30})/); if(cap && !/^(via|viale|piazza|corso|largo|strada|loc)\b/i.test(cap[1].trim()) && /[A-Za-zÀ-ù]{3,}/.test(cap[1])) out.negozioCitta = cap[1].trim().replace(/\s+[A-Za-z]$/, "");
  const tel = all.match(/(?:TEL\.?|TELEFONO)\s*:?\s*([\d\s\/.+]{6,})/i); if(tel) out.negozioTelefono = tel[1].trim();
  // articoli: "DESCRIZIONE ... 22% 12,90" sulla stessa riga, prezzo sulla riga dopo,
  // oppure riga della quantità ("Cad 3,49 Pz. 2", "2 x 3,49") che completa l'articolo sopra
  const SKIP = /(TOTALE|SUBTOTALE|IVA|RESTO|CONTANT|PAGAMENTO|PAGATO|IMPORTO|BANCOMAT|CARTA|SCONTO|VALORE|DOCUMENTO|RIEPILOGO|ARROTOND|DI CUI|RESO|ELETTRONICO|NON RISCOSSO|CASSA|OPERATORE|PREZZO\s*\(|DESCRIZIONE|DETTAGLIO|FORME DI)/i;
  const lineRe = new RegExp("^(.*?[A-Za-z]{2,}.*?)\\s+(?:\\d{1,2}\\s?%\\s+)?" + PRICE + "\\s*[A-Z]?$");
  const onlyPrice = new RegExp("^(?:[A-Z]{0,2}\\s*)?(?:\\d{1,2}\\s?%\\s*)?" + PRICE + "\\s*[A-Z]?$");
  const qtyRes = [
    [new RegExp("^(?:cad\\.?|c\\/u|cadauno|cad\\.? ?uno)\\s*:?\\s*" + PRICE + "\\s*(?:€|eur)?\\s*(?:pz\\.?|pezzi|n\\.?|x)\\s*(\\d{1,3})\\b", "i"), 1, 2],
    [new RegExp("^(?:pz\\.?|n\\.?)?\\s*(\\d{1,3})\\s*(?:pz\\.?)?\\s*[xX*]\\s*" + PRICE, "i"), 2, 1]
  ];
  const pulisci = d => d.replace(/\s+\d{1,2}\s?%.*$/, "").replace(/[\s-]+0?\d{6,8}\s*$/, "").replace(/^[A-Z]{2,4}\d{3,}\s+/, "").replace(/^\d{6,}\s+/, "").replace(/^[A-Za-z]\s+(?=[A-Za-z]{3,})/, "").replace(/\s{2,}/g, " ").trim();
  let pending = "";
  for(let i = 0; i < lines.length; i++){
    const l = lines[i];
    if(SKIP.test(l)){ pending = ""; continue; }
    let qm = null, qi = null;
    for(const [re, pu, pq] of qtyRes){ const m = l.match(re); if(m){ qm = m; qi = [pu, pq]; break; } }
    if(qm){
      const unit = num(qm[qi[0]]), qty = parseInt(qm[qi[1]], 10);
      if(unit > 0 && qty > 0 && qty < 1000){
        const tot = Math.round(unit * qty * 100) / 100, last = out.articoli[out.articoli.length - 1];
        if(pending){ out.articoli.push({descrizione:pulisci(pending), quantita:qty, prezzo:tot}); pending = ""; }
        else if(last && (last.quantita || 1) === 1 && Math.abs((last.prezzo || 0) - tot) < 0.02) last.quantita = qty;
      }
      continue;
    }
    let m = l.match(lineRe), desc, price;
    if(m){ desc = m[1]; price = num(m[2]); }
    else if(/[A-Za-z]{3,}/.test(l) && lines[i + 1] && onlyPrice.test(lines[i + 1]) && !SKIP.test(lines[i + 1])){
      desc = l; price = num(lines[i + 1].match(onlyPrice)[1]); i++;
    }
    if(desc && price !== null && price > 0){
      if(qtyRes.some(([re]) => re.test(desc))){ pending = ""; continue; }
      desc = pulisci(desc);
      let qty = 1; const q = desc.match(/^(\d{1,2})\s*[xX*]\s+(.*)$/); if(q){ qty = +q[1]; desc = q[2]; }
      if(desc.length >= 2) out.articoli.push({descrizione:desc, quantita:qty, prezzo:price});
      pending = "";
    }else if(/[A-Za-z]{3,}/.test(l) && (/\d{1,2}\s?%\s*$/.test(l) || /[\s-]0?\d{6,8}\s*$/.test(l))) pending = l;
    else pending = "";
  }
  return out;
}
function nomeDaArticoli(art){
  if(!art.length) return "";
  const buoni = art.filter(a => /[A-Za-z]{3,}/.test(a.descrizione || "") && !/^(cad|pz|n\.)\b/i.test(a.descrizione || ""));
  if(!buoni.length) return "";
  const top = [...buoni].sort((a, b) => (b.prezzo || 0) - (a.prezzo || 0))[0].descrizione;
  return top.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).split(" ").slice(0, 4).join(" ");
}

async function claudeRead(files){
  const s = settings(); if(!s.apiKey) throw new Error("Nessuna chiave API di Claude in Impostazioni.");
  const content = files.map(f => f.mime === "application/pdf"
    ? {type:"document", source:{type:"base64", media_type:"application/pdf", data:f.data}}
    : {type:"image", source:{type:"base64", media_type:f.mime, data:f.data}});
  content.push({type:"text", text:`Leggi lo scontrino/fattura (Italia) e rispondi SOLO con JSON: {"negozio":"","nome":"nome breve dell'acquisto principale","dataAcquisto":"AAAA-MM-GG","prezzo":numero|null,"numeroScontrino":"","tipoPagamento":"","negozioIndirizzo":"","negozioCitta":"","negozioTelefono":"","garanziaMesi":24,"articoli":[{"descrizione":"","quantita":1,"prezzo":0}],"note":""}. Unisci descrizioni su più righe, ignora IVA/resto/pagamenti. Se l'anno è nel futuro è un errore di stampa: correggilo (oggi è ${todayISO()}).`});
  const body = JSON.stringify({model:s.model, max_tokens:2500, messages:[{role:"user", content}]});
  const r = JSON.parse(await call("claudeRequest", body, s.apiKey));
  const j = JSON.parse(r.body);
  if(r.status !== 200) throw new Error("Claude: " + (j.error?.message || r.status));
  const txt = (j.content || []).filter(c => c.type === "text").map(c => c.text).join("");
  const m = txt.match(/\{[\s\S]*\}/); if(!m) throw new Error("Risposta di Claude non leggibile.");
  return JSON.parse(m[0]);
}

function entryFromFolder(f){

    dataAcquisto: dm ? `${annoCartella}-${dm[3]}-${dm[4]}` : "", annoCartellaErrato: annoCorretto, garanziaMesi: settings().mesiDefault, prezzo:"", numeroScontrino:"",
    tipoPagamento:"", negozioIndirizzo:"", negozioCitta:"", negozioTelefono:"", note:"", articoli:[],
    files:(f.files || []).map(x => ({name:x.name, size:x.size})), hasInfo:false, modificato:(f.files || []).reduce((m, x) => Math.max(m, x.mtime || 0), 0)};

async function refreshFromNas(quiet){
  if(!archivioPronto()){ setNasState("unknown"); setSync("none"); return false; }
  // se il collegamento è già verde resta verde: cambia solo la scritta
  if(nasState !== "on") setNasState("run");
  setSync("run");
  try{
    const folders = JSON.parse(await call("nasList"));
    const old = await allAcquisti(), keep = old.filter(a => a.daCaricare);
    const s = await st("readwrite"); await rq(s.clear());
    const s2 = await st("readwrite");
    for(const f of folders) s2.put(entryFromFolder(f));
    for(const a of keep) s2.put(a);
    await new Promise(r => { s2.transaction.oncomplete = r; s2.transaction.onerror = r; });
    saveSettings({ultimoAggiornamento:new Date().toISOString()});
    setNasState("on"); setSync("ok");
    if(keep.length) await uploadPending(true);
    syncReminders(); updateBadge();
    if(!quiet) toast(`Archivio aggiornato: ${folders.length} acquisti.`);
    return true;
  }catch(e){
    setNasState("off"); setSync("old");
    if(!quiet) toast(e.message, true);
    return false;
  }
}

/* ---------- Import dal programma Windows (CSV "Esporta CSV" o catalogo JSON) ---------- */
function decodificaTesto(bytes){
  let t = new TextDecoder("utf-8").decode(bytes);
  if(t.includes("�")){ try{ t = new TextDecoder("windows-1252").decode(bytes); }catch(e){} }
  return t.replace(/^﻿/, "");
}
function parseCSV(t){
  const first = t.split(/\r?\n/)[0] || "";
  const sep = [";", ",", "\t"].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = "", q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c === '"') q = true;
    else if(c === sep){ row.push(cell); cell = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && t[i + 1] === "\n") i++; row.push(cell); cell = ""; if(row.some(x => x.trim())) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if(row.some(x => x.trim())) rows.push(row);
  return rows;
}
function vociDaWindows(testo){
  const t = testo.trim();
  if(t.startsWith("{") || t.startsWith("[")){
    const j = JSON.parse(t);
    const arr = Array.isArray(j) ? j : (j.items || j.voci || j.entries || j.catalogo || j.catalog || Object.values(j).find(Array.isArray) || []);
    return arr.filter(x => x && typeof x === "object");
  }
  const rows = parseCSV(t); if(rows.length < 2) throw new Error("Il file è vuoto o non è un CSV del programma.");
  const norm = h => h.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z]/g, "");
  const MAP = [["cartella","cartella"],["percorso","cartella"],["folder","cartella"],["oggetto","nome"],["nome","nome"],["descrizione","nome"],["negoziocitta","negozioCitta"],["citta","negozioCitta"],["negoziotelefono","negozioTelefono"],["telefono","negozioTelefono"],["negozioindirizzo","negozioIndirizzo"],["indirizzo","negozioIndirizzo"],["negozio","negozio"],["prezzo","prezzo"],["importo","prezzo"],["totale","prezzo"],["dataacquisto","dataAcquisto"],["acquisto","dataAcquisto"],["data","dataAcquisto"],["garanziamesi","garanziaMesi"],["mesi","garanziaMesi"],["garanzia","garanziaMesi"],["numeroscontrino","numeroScontrino"],["nscontrino","numeroScontrino"],["scontrino","numeroScontrino"],["pagamento","tipoPagamento"],["note","note"],["file","file"],["categoria","categoria"]];
  const cols = rows[0].map(h => { const n = norm(h); if(n.includes("scadenza") || n === "stato") return ""; const m = MAP.find(([k]) => n === k) || MAP.find(([k]) => n.includes(k)); return m ? m[1] : ""; });
  if(!cols.includes("cartella") && !cols.includes("nome")) throw new Error("Non riconosco le colonne del file: serve il CSV di \"Esporta CSV\" del programma Windows.");
  return rows.slice(1).map(r => { const o = {}; cols.forEach((k, i) => { if(k && !(k in o)) o[k] = (r[i] ?? "").trim(); }); return o; });
}
function prezzoNum(v){
  if(v === null || v === undefined || v === "") return "";
  if(typeof v === "number") return isFinite(v) && v > 0 ? v : "";
  let t = String(v).replace(/[€\s]/g, "").replace(/[^\d.,-]/g, "");
  if(!t) return "";
  if(t.includes(",") && t.includes(".")) t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  else t = t.replace(",", ".");
  const n = parseFloat(t); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : "";
}
function dataISO(v){
  const t = String(v || "").trim(); let m;
  if((m = t.match(/^(\d{4})[-_/.](\d{1,2})[-_/.](\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  if((m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return "";
}
async function importaDaWindows(testo, avanza){
  const voci = vociDaWindows(testo);
  if(!voci.length) throw new Error("Nel file non ci sono acquisti.");
  const list = await allAcquisti();
  if(!list.length) throw new Error("L'elenco dell'archivio è vuoto: aggiornalo prima (pallino verde in alto).");
  const k = x => String(x || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
  const coda = p => String(p || "").replace(/\\/g, "/").split("/").filter(Boolean).slice(-2).map(k).join("/");
  const perCartella = new Map(), perDati = new Map();
  for(const a of list){
    perCartella.set(coda(a.cartella), a);
    const dRaw = a.annoCartellaErrato && a.dataAcquisto ? a.annoCartellaErrato + a.dataAcquisto.slice(4) : a.dataAcquisto;
    const nomeBase = String(a.nome || "").split(" / ").pop();
    for(const d of new Set([a.dataAcquisto, dRaw])) perDati.set(k(a.negozio) + "|" + k(nomeBase) + "|" + d, a);
  }
  const CAMPI = ["numeroScontrino","tipoPagamento","negozioIndirizzo","negozioCitta","negozioTelefono","note","categoria"];
  const daSalvare = [], nonTrovati = []; let giaOk = 0;
  for(const v of voci){
    const cart = v.cartella || v.folder || v.path || "";
    const a = (cart && perCartella.get(coda(cart))) || perDati.get(k(v.negozio) + "|" + k(v.nome) + "|" + dataISO(v.dataAcquisto));
    if(!a){ nonTrovati.push(v.nome || cart || "?"); continue; }
    let cambiato = false;
    const p = prezzoNum(v.prezzo);
    if(p !== "" && (a.prezzo === "" || a.prezzo == null)){ a.prezzo = p; cambiato = true; }
    const mesi = parseInt(v.garanziaMesi, 10);
    if(mesi > 0 && !a.hasInfo && Number(a.garanziaMesi) !== mesi){ a.garanziaMesi = mesi; cambiato = true; }
    for(const c of CAMPI){ const val = v[c] == null ? "" : String(v[c]).trim(); if(val && val !== "0" && !String(a[c] || "").trim()){ a[c] = val; cambiato = true; } }
    if(Array.isArray(v.articoli) && v.articoli.length && !(a.articoli || []).length){ a.articoli = v.articoli; cambiato = true; }
    if(cambiato){ if(!daSalvare.includes(a)) daSalvare.push(a); } else giaOk++;
  }
  let fatti = 0, errori = 0;
  for(const a of daSalvare){
    avanza && avanza(`Salvo i dati nell'archivio… ${fatti + errori + 1} di ${daSalvare.length}`);
    try{ await writeToNas(a); }catch(e){ a.daCaricare = true; errori++; }
    await putAcquisto(a); fatti++;
  }
  return {letti:voci.length, aggiornati:daSalvare.length - errori, errori, giaOk, nonTrovati};
}
function infoJSON(a){
  const keys = ["nome","negozio","dataAcquisto","garanziaMesi","prezzo","numeroScontrino","tipoPagamento","negozioIndirizzo","negozioCitta","negozioTelefono","categoria","note","articoli"];
  const o = {app:"GaranzieScontrini", versione:1, aggiornato:new Date().toISOString()};
  keys.forEach(k => o[k] = a[k] ?? ""); return JSON.stringify(o, null, 2);
}
async function writeToNas(a){
  for(const f of (a.pendingFiles || [])){
    const used = await call("nasWriteFile", a.cartella, f.name, f.data);
    a.files = (a.files || []).filter(x => x.name !== used).concat([{name:used, size:Math.round(f.data.length * 0.75)}]);
  }
  await call("nasWriteText", a.cartella, "garanzia.json", infoJSON(a));
  a.pendingFiles = []; a.daCaricare = false; a.hasInfo = true;
}
async function uploadPending(quiet){
  const list = (await allAcquisti()).filter(a => a.daCaricare); let ok = 0;
  for(const a of list){ try{ await writeToNas(a); await putAcquisto(a); ok++; }catch(e){ if(!quiet) toast("Caricamento non riuscito: " + e.message, true); break; } }
  if(ok && !quiet) toast(`${ok} acquisti caricati nell'archivio.`);
  return ok;
}

  return {id:"", cartella:"", negozio:"", nome:"", categoria:"", dataAcquisto:todayISO(), prezzo:"", numeroScontrino:"", tipoPagamento:"",
    negozioIndirizzo:"", negozioCitta:"", negozioTelefono:"", garanziaMesi:settings().mesiDefault, articoli:[], note:"", files:[], pendingFiles:[]};
}
async function renderAcquisisci(edit){
  if(edit){ draft = JSON.parse(JSON.stringify(edit)); draft.pendingFiles = draft.pendingFiles || []; draft._edit = true; lastOcr = ""; }
  if(!draft) draft = newDraft();
  const isEdit = !!draft._edit, hasKey = !!settings().apiKey;
  $("#view").innerHTML = `
    ${nasBanner()}${await pendingBanner()}
    <div class="card">
      <h2>${isEdit ? "✏️ Modifica: " + esc(draft.nome || "acquisto") : "1. Scontrino"}</h2>
      <p class="muted">${isEdit ? "Puoi aggiungere altri documenti (es. certificato di garanzia). \"Leggi scontrino\" legge anche i documenti già salvati e completa i campi vuoti, come la data." : "Fotografa lo scontrino (anche in più foto se è lungo) o scegli una foto/PDF già salvato."}</p>
      <div class="btns">
        <button class="btn" id="bCam">📷 Scatta foto</button>
        <button class="btn" id="bFile">📁 Scegli file</button>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <div class="btns">
        <button class="btn primary" id="bLeggi">🔎 Leggi scontrino</button>
        ${hasKey ? `<button class="btn" id="bClaude">🤖 Rileggi con Claude</button>` : ""}
      </div>
      <div class="status" id="leggiStatus"></div>
      <details id="ocrBox" class="${lastOcr ? "" : "hidden"}"><summary>Testo letto dal documento (per verifica)</summary><pre class="ocr">${esc(lastOcr)}</pre></details>
    </div>
    <div class="card">
      <h2>${isEdit ? "Dati" : "2. Controlla i dati"}</h2>
      <div class="row">
        <div><label>Negozio</label><input id="fNegozio"></div>
        <div><label>Nome oggetto</label><input id="fNome"></div>
      </div>
      <div class="row">
        <div><label>Data acquisto</label><input id="fData" type="date"></div>
        <div><label>Prezzo (€)</label><input id="fPrezzo" type="number" step="0.01" inputmode="decimal"></div>
      </div>
      <div class="row">
        <div><label>Garanzia (mesi)</label><input id="fMesi" type="number" min="0" inputmode="numeric"></div>
        <div><label>N. scontrino</label><input id="fNum"></div>
      </div>
      <div class="row">
        <div><label>Pagamento</label><input id="fPag"></div>
        <div><label>Città negozio</label><input id="fCitta"></div>
      </div>
      <label>Indirizzo negozio</label><input id="fInd">
      <label>Articoli</label>
      <table class="items" id="itemsTbl"></table>
      <button class="btn small" id="bAddItem" style="margin-top:6px">＋ Aggiungi articolo</button>
      <label>Note (matricola, modello…)</label><textarea id="fNote"></textarea>
      <p class="muted" id="scadPreview"></p>
      <p class="muted" id="destPreview"></p>
      <div class="btns">
        ${isEdit ? `<button class="btn" id="bAnnulla">Annulla</button>` : `<button class="btn" id="bReset">Svuota</button>`}
        <button class="btn" id="bStampaA">🖨️ Stampa</button>
        <button class="btn primary" id="bSalva">💾 Salva</button>
      </div>
    </div>`;
  bindPending();
  const F = {fNegozio:"negozio", fNome:"nome", fData:"dataAcquisto", fPrezzo:"prezzo", fMesi:"garanziaMesi", fNum:"numeroScontrino", fPag:"tipoPagamento", fCitta:"negozioCitta", fInd:"negozioIndirizzo", fNote:"note"};
  for(const [id, k] of Object.entries(F)){ $("#" + id).value = draft[k] ?? ""; $("#" + id).oninput = () => { readForm(); updPreview(); }; }
  // in modifica tutti i campi sono modificabili: i dati vanno nel file garanzia.json, la cartella resta quella
  drawThumbs(); drawItems(); updPreview();
  $("#bCam").onclick = () => $("#camInput").click();
  $("#bFile").onclick = () => $("#fileInput").click();
  $("#bLeggi").onclick = () => doLeggi(false);
  if($("#bClaude")) $("#bClaude").onclick = () => doLeggi(true);
  $("#bAddItem").onclick = () => { readForm(); draft.articoli.push({descrizione:"", quantita:1, prezzo:""}); drawItems(); };
  $("#bSalva").onclick = doSalva;
  $("#bStampaA").onclick = async () => {
    readForm();
    const b = $("#bStampaA"); b.disabled = true;
    try{
      const imgs = draft.pendingFiles.filter(f => f.mime.startsWith("image/")).map(f => ({name:f.name, src:dataUrl(f)}));
      const altri = draft.pendingFiles.filter(f => !f.mime.startsWith("image/")).map(f => f.name);
      if(draft._edit) for(const f of (draft.files || [])){ if(isImg(f.name)){ try{ imgs.push({name:f.name, src:`data:${mimeOf(f.name)};base64,` + await call("nasRead", draft.cartella + "/" + f.name)}); }catch(e){ altri.push(f.name); } } else if(f.name !== "garanzia.json") altri.push(f.name); }
      await stampaScheda(draft, imgs, altri);
    }catch(e){ toast(e.message, true); }
    b.disabled = false;
  };
  if($("#bReset")) $("#bReset").onclick = async () => { if(await conferma("Svuotare il modulo?", "Svuota")){ draft = newDraft(); lastOcr = ""; renderAcquisisci(); } };
  if($("#bAnnulla")) $("#bAnnulla").onclick = () => { draft = null; window.onAndroidBack(); };
}
function updPreview(){
  const s = scadenzaInfo(draft);
  $("#scadPreview").innerHTML = s.date ? `Garanzia: <span class="pill ${s.cls}">${esc(s.label)}</span>` : "";
  $("#destPreview").textContent = draft._edit
    ? "Cartella nell'archivio: " + draft.cartella.replace(/\//g, "\\") + " (resta questa; i dati modificati vengono salvati nel file garanzia.json)"
    : "Cartella nell'archivio: " + folderFor(draft).replace(/\//g, "\\");
}
function readForm(){
  const v = id => $("#" + id).value.trim();
  Object.assign(draft, {negozio:v("fNegozio"), nome:v("fNome"), dataAcquisto:$("#fData").value, prezzo: v("fPrezzo") === "" ? "" : Number(v("fPrezzo")),
    garanziaMesi: v("fMesi") === "" ? 0 : Number(v("fMesi")), numeroScontrino:v("fNum"), tipoPagamento:v("fPag"), negozioCitta:v("fCitta"), negozioIndirizzo:v("fInd"), note:$("#fNote").value.trim()});
  document.querySelectorAll("#itemsTbl tr[data-i]").forEach(tr => {
    const it = draft.articoli[+tr.dataset.i];
    it.descrizione = tr.querySelector(".d").value; it.quantita = Number(tr.querySelector(".q").value) || 1;
    it.prezzo = tr.querySelector(".p").value === "" ? "" : Number(tr.querySelector(".p").value);
  });
}
function drawThumbs(){
  const old = (draft.files || []).map(f => `<div class="thumb" title="Già nell'archivio">${isImg(f.name) ? "🖼️" : "📄"}<br>${esc(f.name.slice(0, 22))}</div>`);
  const neu = draft.pendingFiles.map((f, i) => `<div class="thumb" data-i="${i}">${f.mime.startsWith("image/") ? `<img src="${dataUrl(f)}">` : `📄<br>${esc(f.name.slice(0, 22))}`}<button data-del="${i}">✕</button></div>`);
  $("#thumbs").innerHTML = old.concat(neu).join("") || `<span class="muted">Nessun documento.</span>`;
  $("#thumbs").querySelectorAll("[data-del]").forEach(b => b.onclick = e => { e.stopPropagation(); draft.pendingFiles.splice(+b.dataset.del, 1); drawThumbs(); });
  $("#thumbs").querySelectorAll(".thumb[data-i]").forEach(t => t.onclick = () => showLocal(draft.pendingFiles[+t.dataset.i]));
}
function drawItems(){
  $("#itemsTbl").innerHTML = draft.articoli.map((it, i) => `<tr data-i="${i}"><td>
     <input class="d" value="${esc(it.descrizione)}" placeholder="Descrizione articolo">
     <div class="artline">
       <span>Q.tà</span><input class="q" type="number" min="1" inputmode="numeric" value="${esc(it.quantita ?? 1)}">
       <span>€</span><input class="p" type="number" step="0.01" inputmode="decimal" value="${esc(it.prezzo ?? "")}" placeholder="0,00">
       <button class="btn small" data-nome="${i}" title="Usa come nome oggetto">⭐ Nome</button>
       <button class="btn small" data-rm="${i}" title="Togli">✕</button>
     </div></td></tr>`).join("") || `<tr><td class="muted">Nessun articolo.</td></tr>`;
  $("#itemsTbl").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { readForm(); draft.articoli.splice(+b.dataset.rm, 1); drawItems(); });
  $("#itemsTbl").querySelectorAll("[data-nome]").forEach(b => b.onclick = () => {
    readForm(); const it = draft.articoli[+b.dataset.nome]; if(!it || !it.descrizione) return;
    draft.nome = it.descrizione.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()); $("#fNome").value = draft.nome; updPreview();
    toast("Nome oggetto: " + draft.nome);
  });
}
async function addFiles(list){
  if(!draft) draft = newDraft();
  for(const file of list){ try{ draft.pendingFiles.push(await prepareFile(file)); }catch(e){ toast("Impossibile leggere " + (file.name || "il file"), true); } }
  if(current === "acquisisci"){ drawThumbs(); if(!draft._edit && list.length && !draft.articoli.length) doLeggi(false); }
}
$("#camInput").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
$("#fileInput").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };

async function doLeggi(useClaude){
  const giaSalvati = (draft.files || []).filter(f => /\.(pdf|jpe?g|png|webp)$/i.test(f.name));
  if(!draft.pendingFiles.length && !(draft._edit && giaSalvati.length)){ toast("Prima scatta una foto o scegli un file.", true); return; }
  readForm();
  const stEl = $("#leggiStatus");
  document.querySelectorAll("#bLeggi,#bClaude").forEach(b => b.disabled = true);
  stEl.innerHTML = `<span class="spinner"></span>${useClaude ? "Claude sta leggendo lo scontrino…" : "Leggo lo scontrino…"}`;
  try{
    // in modifica, senza documenti nuovi, legge quelli già salvati nell'archivio (prima lo "scontrino")
    let docs = draft.pendingFiles;
    if(!docs.length){
      const ord = [...giaSalvati].sort((x, y) => (/scontrin|fattur|ricevut/i.test(y.name) ? 1 : 0) - (/scontrin|fattur|ricevut/i.test(x.name) ? 1 : 0)).slice(0, 2);
      docs = [];
      for(const f of ord) docs.push({name:f.name, mime:mimeOf(f.name), data: await call("nasRead", draft.cartella + "/" + f.name)});
    }
    let r;
    if(useClaude) r = await claudeRead(docs);
    else{
      const texts = [];
      for(const f of docs) texts.push(await call("ocr", f.data, f.mime));
      lastOcr = texts.join("\n"); r = parseReceipt(lastOcr); r.nome = nomeDaArticoli(r.articoli);
    }
    // in modifica la lettura completa solo i campi vuoti, senza cambiare quelli già compilati
    const set = (k, v) => { if(v !== undefined && v !== null && v !== "" && !(draft._edit && draft[k])) draft[k] = v; };
    ["negozio","nome","dataAcquisto","prezzo","numeroScontrino","tipoPagamento","negozioIndirizzo","negozioCitta","negozioTelefono"].forEach(k => set(k, r[k]));
    if(typeof r.garanziaMesi === "number") draft.garanziaMesi = r.garanziaMesi;
    if(Array.isArray(r.articoli) && r.articoli.length) draft.articoli = r.articoli.map(x => ({descrizione:String(x.descrizione || ""), quantita:Number(x.quantita) || 1, prezzo: typeof x.prezzo === "number" ? x.prezzo : ""}));
    if(r.note) draft.note = draft.note ? draft.note + "\n" + r.note : r.note;
    await renderAcquisisci();
    $("#leggiStatus").innerHTML = "✅ Dati compilati: controllali prima di salvare." + (!useClaude && !r.articoli.length ? " Non ho riconosciuto gli articoli: aggiungili a mano se servono." : "");
  }catch(e){
    stEl.innerHTML = `<span style="color:var(--bad)">❌ ${esc(e.message)}</span>`;
    document.querySelectorAll("#bLeggi,#bClaude").forEach(b => b.disabled = false);
  }
}

async function doSalva(){
  readForm();
  if(!draft.nome && !draft.negozio){ toast("Scrivi almeno il negozio o il nome dell'oggetto.", true); return; }
  if(!draft._edit && !draft.pendingFiles.length && !(await conferma("Nessuna foto o PDF allegato. Salvare lo stesso?", "Salva"))) return;
  const a = draft;
  if(!a._edit){
    // nome cartella unico
    const all = await allAcquisti(); let base = folderFor(a), c = base, n = 2;
    while(all.some(x => x.cartella.toLowerCase() === c.toLowerCase())) c = `${base} (${n++})`;
    a.cartella = a.id = c;
    const stem = safeName(a.nome) || "scontrino";
    a.pendingFiles.forEach((f, i) => { f.name = `${stem}_${i + 1}.${extOf(f.name) || "jpg"}`; });
  }else{
    const stem = safeName(a.nome) || "documento", start = (a.files || []).length;
    a.pendingFiles.forEach((f, i) => { f.name = `${stem}_${start + i + 1}.${extOf(f.name) || "jpg"}`; });
  }
  delete a._edit; a.daCaricare = true;
  const b = $("#bSalva"); b.disabled = true; b.innerHTML = `<span class="spinner"></span>Salvo…`;
  let msg;
  try{
    if(!archivioPronto()) throw new Error("destinazione dei file non configurata");
    await writeToNas(a);
    setNasState("on", etichettaArchivio());
    msg = "✅ Salvato in " + a.cartella.replace(/\//g, "\\");
  }catch(e){
    setNasState(archivioPronto() ? "off" : "unknown");
    msg = "Salvato sul telefono. Lo carico nell'archivio appena è raggiungibile (" + e.message + ").";
  }
  await putAcquisto(a); syncReminders(); updateBadge();
  draft = null; lastOcr = "";
  toast(msg, a.daCaricare);
  navStack = navStack.filter(x => x.v !== "acquisisci");
  current = "home"; currentArg = undefined;
  setView("dettaglio", a.id);
}

let searchQ = "", sortBy = "data";
async function renderArchivio(filtro){
  const tutti = await allAcquisti(), last = settings().ultimoAggiornamento;
  const f = filtro || null, chiave = s => (s || "").trim().toLowerCase();
  const list = !f ? tutti : tutti.filter(a => (!f.negozio || chiave(a.negozio || "Senza negozio") === chiave(f.negozio))
    && (!f.da || (a.dataAcquisto && a.dataAcquisto >= f.da)) && (!f.a || (a.dataAcquisto && a.dataAcquisto <= f.a)));
  if(f) $("#hTitle").textContent = f.negozio ? f.negozio : "Acquisti";
  $("#view").innerHTML = `
    ${nasBanner()}${await pendingBanner()}
    ${f ? `<div class="banner info"><div>🏪 <b>${esc(f.negozio || "Tutti i negozi")}</b>${f.titolo ? " · " + esc(f.titolo) : ""} — ${list.length} acquist${list.length === 1 ? "o" : "i"}</div><button class="btn small" id="bTogliFiltro">Tutti</button></div>` : ""}
    <div class="card" style="padding:10px">
      <input id="q" type="search" placeholder="🔎 Cerca oggetto, negozio, articolo, note, anno…" value="${esc(searchQ)}">
      <div class="row" style="margin-top:8px">
        <select id="sort"><option value="data">Più recenti</option><option value="negozio">Per negozio</option><option value="scadenza">Per scadenza</option><option value="prezzo">Per prezzo</option></select>
        <button class="btn" id="bRefresh" style="flex:none">🔄 Aggiorna dal NAS</button>
      </div>
      <p class="muted" style="margin:8px 2px 0" id="cnt"></p>
    </div>
    <div id="list"></div>`;
  bindPending();
  if($("#bTogliFiltro")) $("#bTogliFiltro").onclick = () => setView("archivio");
  $("#sort").value = sortBy;
  const draw = () => {
    const words = searchQ.toLowerCase().split(/\s+/).filter(Boolean);
    const rows = list.filter(a => { const h = [a.nome, a.negozio, a.note, a.numeroScontrino, a.negozioCitta, a.dataAcquisto, fmtDate(a.dataAcquisto), a.cartella, ...(a.articoli || []).map(x => x.descrizione)].join(" ").toLowerCase(); return words.every(w => h.includes(w)); });
    const cmp = {
      data:(x, y) => (y.dataAcquisto || "").localeCompare(x.dataAcquisto || ""),
      negozio:(x, y) => (x.negozio || "").localeCompare(y.negozio || "", "it") || (y.dataAcquisto || "").localeCompare(x.dataAcquisto || ""),
      scadenza:(x, y) => (scadenzaInfo(x).date || "9999").localeCompare(scadenzaInfo(y).date || "9999"),
      prezzo:(x, y) => (Number(y.prezzo) || 0) - (Number(x.prezzo) || 0)}[sortBy];
    rows.sort(cmp);
    $("#cnt").textContent = `${rows.length} di ${list.length} acquisti` + (last ? ` · aggiornato ${new Date(last).toLocaleString("it-IT", {dateStyle:"short", timeStyle:"short"})}` : "");
    $("#list").innerHTML = rows.slice(0, 300).map(entryHTML).join("") || `<div class="card muted">${list.length ? "Nessun risultato." : "Nessun acquisto: premi \"Aggiorna dal NAS\" o inizia da Acquisisci."}</div>`;
    bindEntries();
  };
  $("#q").oninput = e => { searchQ = e.target.value; draw(); };
  $("#sort").onchange = e => { sortBy = e.target.value; draw(); };
  $("#bRefresh").onclick = async () => { const b = $("#bRefresh"); b.disabled = true; b.innerHTML = `<span class="spinner"></span>Aggiorno…`; await refreshFromNas(false); renderArchivio(); };
  draw();
}
function entryHTML(a){
  const s = scadenzaInfo(a), pdf = (a.files || []).some(f => extOf(f.name) === "pdf"), img = (a.files || []).some(f => isImg(f.name));
  return `<div class="entry" data-id="${esc(a.id)}">
    <div class="ico">${pdf ? "📄" : img ? "🖼️" : "🧾"}</div>
    <div class="txt"><div class="t1">${esc(a.nome || "(senza nome)")}</div>
      <div class="t2">${esc(a.negozio || "—")} · ${fmtDate(a.dataAcquisto)}${a.prezzo !== "" && a.prezzo != null ? " · " + euro(a.prezzo) : ""}</div>
      <div style="margin-top:4px"><span class="pill ${s.cls}">${esc(s.label)}</span>${a.daCaricare ? ` <span class="pill up">⏳ da caricare</span>` : ""}</div></div></div>`;
}
function bindEntries(){ document.querySelectorAll(".entry").forEach(e => e.onclick = () => setView("dettaglio", e.dataset.id)); }

async function renderDettaglio(id){
  const a = await getAcquisto(id);
  if(!a){ setView("archivio"); return; }
  const s = scadenzaInfo(a), files = (a.files || []).map(f => ({...f, nas:true})).concat((a.pendingFiles || []).map(f => ({...f, local:true})));
  const tr = (k, v) => v ? `<tr><td>${k}</td><td class="num">${v}</td></tr>` : "";
  $("#view").innerHTML = `
    <button class="hidden" id="bBack"></button>
    <div class="card">
      <h2>${esc(a.nome || "(senza nome)")}</h2>
      <div class="muted">${esc(a.negozio || "—")}</div>
      <p><span class="pill ${s.cls}">${esc(s.label)}</span>${a.daCaricare ? ` <span class="pill up">⏳ da caricare</span>` : ""}</p>
      <table class="items">
        ${tr("Data acquisto", fmtDate(a.dataAcquisto) + (a.annoCartellaErrato && !a.hasInfo ? ` <span class="pill warn" title="Nel nome della cartella l'anno è ${esc(a.annoCartellaErrato)}">anno corretto da ${esc(a.annoCartellaErrato)}</span>` : ""))}
        ${tr("Prezzo", euro(a.prezzo))}
        ${tr("Garanzia", a.garanziaMesi ? a.garanziaMesi + " mesi" + (a.hasInfo ? "" : " (predefinita)") : "")}
        ${tr("N. scontrino", esc(a.numeroScontrino))}
        ${tr("Pagamento", esc(a.tipoPagamento))}
        ${tr("Negozio", esc([a.negozioIndirizzo, a.negozioCitta, a.negozioTelefono].filter(Boolean).join(" · ")))}
        <tr><td>Cartella</td><td class="num" style="word-break:break-word">${esc(a.cartella.replace(/\//g, "\\"))}</td></tr>
      </table>
      ${(a.articoli || []).length ? `<label>Articoli</label><table class="items">${a.articoli.map(x => `<tr><td>${x.quantita > 1 ? x.quantita + " × " : ""}${esc(x.descrizione)}</td><td class="num">${euro(x.prezzo)}</td></tr>`).join("")}</table>` : ""}
      ${a.note ? `<label>Note</label><div style="white-space:pre-wrap">${esc(a.note)}</div>` : ""}
      <label>Documenti (tocca per aprire)</label>
      <div class="thumbs" id="dThumbs">${files.map((f, i) => `<div class="thumb" data-i="${i}">${f.local && f.mime.startsWith("image/") ? `<img src="${dataUrl(f)}">` : (isImg(f.name) ? "🖼️" : "📄") + "<br>" + esc(f.name.slice(0, 22))}</div>`).join("") || `<span class="muted">Nessuno.</span>`}</div>
      <div class="btns">
        <button class="btn" id="bEdit">✏️ Modifica</button>
        <button class="btn" id="bPrint">🖨️ Stampa</button>
        <button class="btn danger" id="bDel">🗑️ Elimina</button>
      </div>
      ${a.hasInfo ? "" : `<p class="muted">Dati ricavati dal nome della cartella. Con "Modifica" puoi aggiungere prezzo, mesi di garanzia e note: vengono salvati nel file garanzia.json della cartella.</p>`}
    </div>`;
  $("#bBack").onclick = () => setView("archivio");
  $("#dThumbs").querySelectorAll(".thumb").forEach(t => t.onclick = async () => {
    const f = files[+t.dataset.i];
    if(f.local){ showLocal(f); return; }
    t.style.opacity = .5;
    try{ await call("nasOpen", a.cartella + "/" + f.name); }catch(e){ toast(e.message, true); }
    t.style.opacity = 1;
  });
  $("#bEdit").onclick = () => { draft = null; setView("acquisisci", a); };
  $("#bPrint").onclick = async () => {
    const b = $("#bPrint"); b.disabled = true; b.textContent = "⏳ Preparo…";
    try{
      const imgs = [], altri = [];
      for(const f of files){
        if(f.local){ if(f.mime.startsWith("image/")) imgs.push({name:f.name, src:dataUrl(f)}); else altri.push(f.name); continue; }
        if(isImg(f.name)){ try{ imgs.push({name:f.name, src:`data:${mimeOf(f.name)};base64,` + await call("nasRead", a.cartella + "/" + f.name)}); }catch(e){ altri.push(f.name); } }
        else if(f.name !== "garanzia.json") altri.push(f.name);
      }
      await stampaScheda(a, imgs, altri);
    }catch(e){ toast(e.message, true); }
    b.disabled = false; b.textContent = "🖨️ Stampa";
  };

const FILTRI = {warn:"⚠️ In scadenza", ok:"✅ In garanzia", bad:"⛔ Scadute"};
async function renderScadenze(filtro){
  const list = (await allAcquisti()).map(a => ({a, s:scadenzaInfo(a)})).filter(x => x.s.date);
  const pre = list.filter(x => x.s.cls === "warn").sort((x, y) => x.s.days - y.s.days);
  const att = list.filter(x => x.s.cls === "ok").sort((x, y) => x.s.days - y.s.days);
  const sca = list.filter(x => x.s.cls === "bad").sort((x, y) => y.s.days - x.s.days);
  const sec = (t, arr, lim) => arr.length ? `<h2 style="font-size:15px;margin:16px 4px 8px">${t}</h2>` + arr.slice(0, lim).map(x => entryHTML(x.a)).join("") + (arr.length > lim ? `<p class="muted" style="margin:4px">…e altri ${arr.length - lim}</p>` : "") : "";
  const st = (k, n, t) => `<div class="stat ${k}${filtro === k ? " sel" : ""}" data-f="${k}"><b>${n}</b>${t}</div>`;
  const gruppi = {warn:pre, ok:att, bad:sca};
  if(filtro) $("#hTitle").textContent = FILTRI[filtro].replace(/^\S+\s/, "");
  $("#view").innerHTML = `
    <div class="stats">${st("warn", pre.length, "In scadenza")}${st("ok", att.length, "In garanzia")}${st("bad", sca.length, "Scadute")}</div>
    <p class="muted" style="margin:0 4px">${filtro ? "Tocca di nuovo il riquadro per vedere tutte le garanzie." : "Tocca un riquadro per vedere solo quell'elenco."} "In scadenza" = entro ${settings().giorniAvviso} giorni.</p>
    ${filtro
      ? (sec(FILTRI[filtro] + ` (${gruppi[filtro].length})`, gruppi[filtro], 1000) || `<div class="card muted" style="margin-top:14px">Nessun acquisto in questo elenco.</div>`)
      : sec("⚠️ In scadenza", pre, 100) + sec("✅ In garanzia", att, 100) + sec("⛔ Scadute", sca, 30)}
    ${list.length ? "" : `<div class="card muted">Nessun acquisto con data di acquisto e garanzia.</div>`}`;
  document.querySelectorAll(".stat[data-f]").forEach(el => el.onclick = () => {
    const f = el.dataset.f;
    if(filtro === f) window.onAndroidBack(); else if(filtro) setView("scadenze", f, true) ; else setView("scadenze", f);
  });
  bindEntries();
}
async function updateBadge(){
  const n = (await allAcquisti()).filter(a => scadenzaInfo(a).cls === "warn").length;
  const b = $("#badgeScad"); b.textContent = n; b.classList.toggle("hidden", !n);
}
function syncReminders(){
  if(!A || !A.setReminders) return;
  allAcquisti().then(list => {
    const r = list.map(a => ({id:a.id, titolo:a.nome || a.negozio, negozio:a.negozio, scadenza:scadenzaInfo(a).date})).filter(x => x.scadenza && daysLeft(x.scadenza) >= 0);
    A.setReminders(JSON.stringify(r), settings().giorniAvviso);
  });
}

/* ---------- GRAFICI ---------- */
let grafDa = "", grafA = "", grafAnno = "", grafMese = "", grafMisura = "";
const MESI_LUNGHI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
function grafImpostaPeriodo(){
  // mese senza anno = anno in corso; anno senza mese = tutto l'anno
  if(!grafAnno && !grafMese){ grafDa = grafA = ""; return; }
  const y = grafAnno || String(new Date().getFullYear());
  if(grafMese){ const m = Number(grafMese), last = new Date(Number(y), m, 0).getDate(); grafDa = `${y}-${String(m).padStart(2, "0")}-01`; grafA = `${y}-${String(m).padStart(2, "0")}-${last}`; }
  else{ grafDa = y + "-01-01"; grafA = y + "-12-31"; }
}
function euro0(n){ return Number(n || 0).toLocaleString("it-IT", {style:"currency", currency:"EUR", useGrouping:"always", maximumFractionDigits: n >= 1000 ? 0 : 2}); }
async function renderGrafici(){
  const all = await allAcquisti();
  const anni = [...new Set(all.map(a => (a.dataAcquisto || "").slice(0, 4)).filter(y => /^\d{4}$/.test(y) && Number(y) <= new Date().getFullYear() + 1))].sort().reverse();
  const tutto = !grafDa && !grafA;
  const inPeriodo = a => { const d = a.dataAcquisto || ""; return tutto || (d && (!grafDa || d >= grafDa) && (!grafA || d <= grafA)); };
  const list = all.filter(inPeriodo);
  const conPrezzo = list.filter(a => Number(a.prezzo) > 0);
  const tot = conPrezzo.reduce((t, a) => t + Number(a.prezzo), 0);
  const negozi = {};
  for(const a of list){ const n = (a.negozio || "Senza negozio").trim(); const k = n.toLowerCase(); negozi[k] = negozi[k] || {nome:n, euro:0, n:0}; negozi[k].n++; negozi[k].euro += Number(a.prezzo) || 0; }
  // senza prezzi i grafici in euro sarebbero vuoti: allora contano gli acquisti
  // le barre seguono la spesa se ci sono prezzi, altrimenti il numero di acquisti; i testi mostrano sempre entrambi
  const misura = tot > 0 ? "euro" : "n";
  const val = r => misura === "euro" ? r.euro : r.n;
  const fmtVal = v => misura === "euro" ? euro0(v) : `${v} acquist${v === 1 ? "o" : "i"}`;
  let righe = Object.values(negozi).sort((x, y) => val(y) - val(x) || y.n - x.n);
  if(righe.length > 10){ const altri = righe.slice(9); righe = righe.slice(0, 9).concat([{nome:`Altri ${altri.length} negozi`, euro:altri.reduce((t, r) => t + r.euro, 0), n:altri.reduce((t, r) => t + r.n, 0), altri:true}]); }
  const maxNeg = Math.max(1, ...righe.map(val));
  // andamento nel tempo: per mese se è un anno, altrimenti per anno
  const annoUnico = grafDa && grafA && grafDa.slice(0, 4) === grafA.slice(0, 4) ? grafDa.slice(0, 4) : "";
  const meseUnico = annoUnico && grafDa.slice(0, 7) === grafA.slice(0, 7) ? grafDa.slice(0, 7) : "";
  const perGiorno = !!meseUnico, perMese = !!annoUnico && !perGiorno;
  const MESI = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
  let tempo = [];
  if(perGiorno){ const nd = new Date(Number(meseUnico.slice(0, 4)), Number(meseUnico.slice(5, 7)), 0).getDate(); tempo = Array.from({length:nd}, (_, i) => ({k:String(i + 1), euro:0, n:0})); }
  else if(perMese) tempo = MESI.map((m, i) => ({k:m, euro:0, n:0, i}));
  else{ const ys = [...new Set(list.filter(a => a.dataAcquisto).map(a => a.dataAcquisto.slice(0, 4)))].sort(); tempo = ys.map(y => ({k:y, euro:0, n:0})); }
  for(const a of list.filter(a => a.dataAcquisto)){
    const t = perGiorno ? tempo[Number(a.dataAcquisto.slice(8, 10)) - 1] : perMese ? tempo[Number(a.dataAcquisto.slice(5, 7)) - 1] : tempo.find(x => x.k === a.dataAcquisto.slice(0, 4));
    if(t){ t.euro += Number(a.prezzo) || 0; t.n++; }
  }
  const maxT = Math.max(1, ...tempo.map(val));
  const titoloPeriodo = tutto ? "Tutti gli anni" : meseUnico && grafDa.endsWith("-01") ? MESI_LUNGHI[Number(meseUnico.slice(5, 7)) - 1] + " " + meseUnico.slice(0, 4) : grafAnno && !grafMese ? "Anno " + grafAnno : `${fmtDate(grafDa) === "—" ? "inizio" : fmtDate(grafDa)} → ${fmtDate(grafA) === "—" ? "oggi" : fmtDate(grafA)}`;
  const senza = list.length - conPrezzo.length;
  $("#view").innerHTML = `
    <div class="card fcard">
      <div class="fhead">Grafici acquisti e spese</div>
      <div class="fbody">
        <div class="row">
          <div><label>Anno</label><select id="gAnno"><option value="">— anno —</option>${[...new Set([String(new Date().getFullYear()), ...anni])].sort().reverse().map(y => `<option${y === grafAnno ? " selected" : ""}>${y}</option>`).join("")}</select></div>
          <div><label>Mese</label><select id="gMese"><option value="">— mese —</option>${MESI_LUNGHI.map((m, i) => `<option value="${i + 1}"${String(i + 1) === grafMese ? " selected" : ""}>${m}</option>`).join("")}</select></div>
        </div>
        <div class="row">
          <div><label>Da</label><input type="date" id="gDa" value="${grafDa}"></div>
          <div><label>A</label><input type="date" id="gA" value="${grafA}"></div>
        </div>
        <div class="fbtns"><button class="bk" id="gCalc">Calcola</button><button class="bw" id="gTutto">Tutto</button><button class="bw" id="gReset">Reset</button></div>
      </div>
    </div>
    <p class="periodo">📅 ${esc(titoloPeriodo)}</p>
    <div class="kpis">
      <div class="kpi"><div class="kv">${list.length}</div><div class="kl">Acquisti</div></div>
      <div class="kpi"><div class="kv">${tot ? euro0(tot) : "—"}</div><div class="kl">Spesa${tot && senza ? " (parziale)" : ""}</div></div>
      <div class="kpi"><div class="kv">${conPrezzo.length ? euro0(tot / conPrezzo.length) : "—"}</div><div class="kl">Spesa media</div></div>
      <div class="kpi"><div class="kv">${Object.keys(negozi).length}</div><div class="kl">Negozi</div></div>
    </div>
    ${senza ? `<div class="banner warn"><div>💶 ${senza === list.length ? "Nessuno di questi acquisti ha il prezzo" : `${senza} acquist${senza > 1 ? "i" : "o"} su ${list.length} senza prezzo`}: per questo la spesa è ${tot ? "parziale" : "vuota"}. Il prezzo si aggiunge con "Modifica" nella scheda dell'acquisto${tot ? "" : ", oppure con \"Leggi scontrino\" che lo ricava dal documento"}.</div></div>` : ""}
    <div class="card">
      <h2>🏪 Per negozio</h2>
      ${righe.length ? righe.map(r => `<div class="hb"${r.altri ? "" : ` data-neg="${esc(r.nome)}"`} data-tip="${esc(r.nome)}: ${euro0(r.euro)} · ${r.n} acquist${r.n > 1 ? "i" : "o"}">
          <div class="hbl"><span>${esc(r.nome)}</span><b>${r.n} · ${r.euro ? euro0(r.euro) : "— €"}</b></div>
          <div class="hbt"><div class="hbf${r.altri ? " alt" : ""}" style="width:${Math.max(val(r) / maxNeg * 100, val(r) ? 1.5 : 0)}%"></div></div>
          <div class="hbn">${r.n} acquist${r.n > 1 ? "i" : "o"}${r.altri ? "" : " · tocca per vederli ›"}</div></div>`).join("") : `<p class="muted">Nessun acquisto nel periodo.</p>`}
    </div>
    <div class="card">
      <h2>📅 ${misura === "euro" ? "Spesa" : "Acquisti"} ${perGiorno ? "per giorno · " + MESI_LUNGHI[Number(meseUnico.slice(5, 7)) - 1] + " " + annoUnico : perMese ? "per mese · " + annoUnico : "per anno"}</h2>
      <div class="tip" id="gTip">${tempo.length ? "Tocca una barra per vedere il dettaglio." : "Nessuna spesa con data nel periodo."}</div>
      ${tempo.length ? `<div class="vb${tempo.length > 14 ? " fitto" : ""}">${tempo.map(t => `<div class="vbc" data-tip="${perGiorno ? t.k + " " + MESI_LUNGHI[Number(meseUnico.slice(5, 7)) - 1] + " " + annoUnico : t.k + (perMese ? " " + annoUnico : "")}: ${euro0(t.euro)} · ${t.n} acquist${t.n === 1 ? "o" : "i"}"><div class="vbt"><div class="vbf" style="height:${val(t) ? Math.max(val(t) / maxT * 100, 2) : 0}%"></div></div><div class="vbk">${perGiorno && t.k !== "1" && Number(t.k) % 5 ? "&nbsp;" : t.k}</div></div>`).join("")}</div>` : ""}
    </div>
    <div class="card">
      <h2>🧾 Riepilogo</h2>
      <table class="items">${righe.map(r => `<tr><td>${esc(r.nome)}</td><td class="num">${r.n}</td><td class="num">${euro0(r.euro)}</td></tr>`).join("")}
        <tr><td><b>Totale</b></td><td class="num"><b>${list.length}</b></td><td class="num"><b>${euro0(tot)}</b></td></tr></table>
    </div>`;
  $("#gAnno").onchange = e => { grafAnno = e.target.value; grafImpostaPeriodo(); renderGrafici(); };
  $("#gMese").onchange = e => { grafMese = e.target.value; if(grafMese && !grafAnno) grafAnno = String(new Date().getFullYear()); grafImpostaPeriodo(); renderGrafici(); };
  $("#gCalc").onclick = () => { grafDa = $("#gDa").value; grafA = $("#gA").value; grafAnno = grafMese = ""; renderGrafici(); };
  // tocco su un negozio: elenco dei suoi acquisti nel periodo scelto
  document.querySelectorAll(".hb[data-neg]").forEach(c => c.onclick = () => setView("archivio", {negozio:c.dataset.neg, da:grafDa, a:grafA, titolo: tutto ? "" : titoloPeriodo}));
  $("#gTutto").onclick = () => { grafDa = grafA = grafAnno = grafMese = ""; renderGrafici(); };
  $("#gReset").onclick = () => { grafAnno = String(new Date().getFullYear()); grafMese = ""; grafImpostaPeriodo(); renderGrafici(); };
  document.querySelectorAll(".vbc").forEach(c => c.onclick = () => { document.querySelectorAll(".vbc").forEach(x => x.classList.remove("sel")); c.classList.add("sel"); $("#gTip").textContent = c.dataset.tip; });

}

    </div>` : ""}`;
  setNasState(mode === "nas" ? nasState : "unknown");

  document.querySelectorAll(".scelta").forEach(el => el.onclick = async () => {
    const m = el.dataset.m; if(m === archivioScelto()) return;
    if(el.classList.contains("off")){ toast("Disponibile in un prossimo aggiornamento."); return; }
    if(archivioScelto() && archivioPronto() && !(await conferma("Cambiare la destinazione dei file?\n\nGli scontrini già salvati restano dove sono: da ora in poi i nuovi acquisti vanno nella nuova destinazione.", "Cambia"))) return;
    await impostaArchivio(m); renderImpDest(); setNasState("unknown");
    if(archivioPronto()) refreshFromNas(true);
    toast({nas:"Destinazione: NAS di casa", gdrive:"Destinazione: Google Drive", locale:"Destinazione: sul telefono"}[m]);
  });
  const nas = () => ({host:$("#nHost").value.trim().replace(/^\\+/, ""), share:$("#nShare").value.trim().replace(/[\\/]/g, ""), folder:$("#nFolder").value.trim().replace(/^[\\/]+|[\\/]+$/g, "").replace(/\//g, "\\"),
    user:$("#nUser").value.trim(), domain:$("#nDom").value.trim(), password:$("#nPass").value});
  const saveNas = () => { if(!A) throw new Error("Disponibile solo nell'app Android."); A.setNasConfig(JSON.stringify(nas())); $("#nPass").value = ""; $("#nPass").placeholder = nasCfg().hasPassword ? "🔒 salvata" : ""; };
  if($("#nShow")) $("#nShow").onchange = e => {
    const p = $("#nPass"), on = e.target.checked;
    if(on && !p.value && nasCfg().hasPassword && A && A.getNasPassword){ try{ p.value = A.getNasPassword() || ""; }catch(_){} }
    p.type = on ? "text" : "password";
  };
  if($("#nSave")) $("#nSave").onclick = () => { try{ saveNas(); toast("Impostazioni NAS salvate."); setNasState("unknown"); refreshFromNas(true); }catch(e){ toast(e.message, true); } };
  if($("#gIn")) $("#gIn").onclick = async () => {
    try{ const acc = A && A.driveLogin ? await call("driveLogin") : await demoGoogle(); saveSettings({driveAccount:acc}); renderImpDest(); toast("Collegato a Google Drive: " + acc); refreshFromNas(true); }
    catch(e){ toast(e.message, true); }
  };
  if($("#gOut")) $("#gOut").onclick = async () => { if(!(await conferma("Disconnettere l'account Google?\n\nI file su Google Drive restano dove sono.", "Disconnetti"))) return; if(A && A.driveLogout) A.driveLogout(); saveSettings({driveAccount:""}); renderImpDest(); setNasState("unknown"); };
  if($("#lPick")) $("#lPick").onclick = async () => {
    try{ const f = A && A.pickFolder ? await call("pickFolder") : await demoFolder(); saveSettings({localFolder:f}); renderImpDest(); toast("Cartella: " + f); refreshFromNas(true); }
    catch(e){ toast(e.message, true); }
  };
  if($("#vTest")) $("#vTest").onclick = async () => {
    const o = $("#vOut"), b = $("#vTest"); b.disabled = true;
    const passi = [];
    const show = () => o.innerHTML = passi.map(p => `<div class="${p.ok === false ? "koline" : p.ok ? "okline" : "status"}">${p.ok === null ? '<span class="spinner"></span>' : p.ok ? "✅ " : "❌ "}${esc(p.t)}</div>`).join("");
    const passo = async (t, fn) => { const p = {t, ok:null}; passi.push(p); show(); try{ const r = await fn(); p.ok = true; if(r) p.t = r; }catch(e){ p.ok = false; p.t = t + ": " + e.message; show(); throw e; } show(); };
    try{
      if(mode === "nas" && $("#nHost")) saveNas();
      if(A && A.setArchivio){
        await passo("Collegamento, scrittura e lettura di un file di prova", async () => { const r = await call("nasTest"); setNasState("on", etichettaArchivio()); return r; });
        await passo("Lettura dell'archivio", async () => { await refreshFromNas(true); return `Archivio letto: ${(await allAcquisti()).length} acquisti trovati`; });
      }else{
        await passo("Collegamento e prova di scrittura", async () => { if(mode === "nas") return await call("nasTest"); await new Promise(r => setTimeout(r, 800)); return "Destinazione raggiungibile e scrivibile (simulato)"; });
      }
      passi.push({t:"Tutto funziona: puoi salvare gli scontrini.", ok:true}); show();
    }catch(e){ if(mode === "nas") setNasState("off"); }
    b.disabled = false;
  };
}

/* ---------- Backup e ripristino ---------- */
async function salvaFile(nome, mime, testo){
  const b64 = b64utf8(testo);
  if(A && A.saveDownload) return await call("saveDownload", nome, mime, b64);
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([testo], {type:mime})); a.download = nome; a.click();
  return "Download/" + nome;
}

window.onAndroidBack = () => {
  const ov = document.querySelector(".viewer, .modal"); if(ov){ ov.remove(); return true; }
  if(current === "home") return false;              // dalla pagina iniziale si esce dall'app
  let prev = navStack.pop();
  while(prev && prev.v === "dettaglio" && !prev.arg) prev = navStack.pop();

/* ---------- aggiornamenti: avviso con scelta ---------- */
let updRinviato = false, updInAttesa = false;
function leggiNovita(html){
  const out = {v:"", note:[]};
  const mv = html.match(/const VERSIONE = "([^"]+)"/); if(mv) out.v = mv[1];
  const mc = html.match(/const CRONOLOGIA = (\[[\s\S]*?\n\]);/);
  if(mc){ try{ const cr = new Function("return " + mc[1])(); const r = cr.find(x => x.v === out.v) || cr[0]; if(r) out.note = r.n || []; }catch(e){} }
  return out;
}
function occupato(){ return (current === "acquisisci" && draft && ((draft.pendingFiles || []).length || draft.nome || draft.negozio)) || document.querySelector(".modal"); }
function proponiAggiornamento(){
  if(!A || !A.getPendingUpdate || updRinviato) return;
  const html = A.getPendingUpdate(); if(!html) return;
  if(occupato()){ updInAttesa = true; return; }      // lo propone appena torni alla pagina iniziale
  updInAttesa = false;
  const n = leggiNovita(html), stessa = n.v === VERSIONE;
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><h2>🔄 ${stessa ? "Aggiornamento disponibile" : "È disponibile la " + esc(n.v)}</h2>
    <p class="muted" style="margin:0 0 8px">Versione installata: ${VERSIONE}${n.v && !stessa ? " → nuova: " + esc(n.v) : ""}</p>
    ${n.note.length ? `<div class="rel"><b>Novità</b><ul>${n.note.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    <div class="btns"><button class="btn" id="updDopo">Più tardi</button><button class="btn primary" id="updOra">Aggiorna ora</button></div></div>`;
  document.body.appendChild(m);
  $("#updDopo").onclick = () => { updRinviato = true; m.remove(); toast("Te lo ricordo alla prossima apertura."); };
  $("#updOra").onclick = () => { try{ sessionStorage.setItem("gs_aggiornata", "1"); }catch(e){} m.remove(); A.applyUpdate(); };
}
window.onWebUpdate = proponiAggiornamento;
try{ if(sessionStorage.getItem("gs_aggiornata")){ sessionStorage.removeItem("gs_aggiornata"); setTimeout(() => toast("✅ App aggiornata alla " + VERSIONE), 600); } }catch(e){}
setTimeout(proponiAggiornamento, 1500);   // versione scaricata in precedenza e non ancora applicata

/* Aggiornamento dell'app Android (APK): la grafica si aggiorna da sola, ma alcune novità
   (es. la stampa) richiedono di reinstallare l'app sopra quella attuale. */
const APK_MINIMO = 9, APK_LINK = "https://github.com/vitobsta-cloud/Garanzie-Scontrini-app/releases/latest/download/GaranzieScontrini.apk";
function versioneApk(){ if(!A) return 999; try{ if(A.getVersionCode) return Number(A.getVersionCode()) || 0; }catch(e){} return A.stampa ? 9 : 8; }
function proponiApk(forza){
  if(versioneApk() >= APK_MINIMO) return false;
  if(!forza){ try{ if(localStorage.getItem("gs_apk_rinvio") === todayISO()) return true; }catch(e){} }
  if(occupato() || document.querySelector(".modal")){ if(!forza) setTimeout(() => proponiApk(false), 60000); return true; }
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><h2>📲 Nuova versione dell'app</h2>
    <p style="margin:4px 0 8px;line-height:1.5">C'è una versione nuova dell'app da installare (serve per la stampa e per le prossime novità).</p>
    <p class="muted" style="margin:0 0 8px">Tocca <b>Scarica</b>, apri il file scaricato e scegli <b>Installa</b>/<b>Aggiorna</b>. Si installa sopra quella attuale: dati e impostazioni restano.</p>
    <div class="btns"><button class="btn" id="apkDopo">Più tardi</button><button class="btn primary" id="apkOra">⬇️ Scarica</button></div></div>`;
  document.body.appendChild(m);
  $("#apkDopo").onclick = () => { try{ localStorage.setItem("gs_apk_rinvio", todayISO()); }catch(e){} m.remove(); toast("Te lo ricordo domani."); };
  $("#apkOra").onclick = () => { m.remove(); location.href = APK_LINK; };
  return true;
}
setTimeout(() => proponiApk(false), 4000);
if(A && A.setArchivio && archivioScelto()) A.setArchivio(archivioScelto());
/* Collegamento all'archivio: prima un controllo veloce (pallino verde subito),
   poi, solo se serve, l'aggiornamento dell'elenco in sottofondo. I documenti si scaricano quando li apri. */
let ultimoPing = 0;
const AGGIORNA_DOPO_MIN = 30;
async function collegaArchivio(forzaElenco){
  if(!archivioPronto()) return;
  const n = (await allAcquisti()).length;
  if(A.nasPing){
    if(nasState !== "on") setNasState("run");
    try{ await call("nasPing"); ultimoPing = Date.now(); setNasState("on"); }
    catch(e){ setNasState("off"); setSync(n ? "old" : "none"); return; }
  }
  const vecchio = Date.now() - Date.parse(settings().ultimoAggiornamento || 0) > AGGIORNA_DOPO_MIN * 60 * 1000;
  if(!vecchio && n) setSync("ok");
  if(forzaElenco || vecchio || !n){
    const ok = await refreshFromNas(true);
    if(ok && ["home","archivio","scadenze","grafici"].includes(current)) setView(current, currentArg, true);
  }else if(n && (await allAcquisti()).some(a => a.daCaricare)) uploadPending(true);
}
window.onAndroidResume = () => { if(archivioPronto() && Date.now() - ultimoPing > 5 * 60 * 1000) collegaArchivio(false); };
setNasState("unknown"); setSync(settings().ultimoAggiornamento ? "old" : "none");
setView(A && !archivioPronto() ? "impostazioni" : "home");
updateBadge();
if(archivioPronto()) collegaArchivio(false);
</script>
